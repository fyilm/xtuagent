<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XtuAgent · 校园智能学业问答系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎓</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">X</div>
        <div class="brand-text">
          <h1>XtuAgent</h1>
          <p>校园智能学业问答系统</p>
        </div>
      </div>

      <div class="status-card" id="statusCard">
        <span class="dot loading" id="statusDot"></span>
        <div class="status-info">
          <span class="status-title" id="statusText">正在连接服务…</span>
          <span class="status-sub" id="statusSub">初始化中</span>
        </div>
      </div>

      <div class="panel">
        <label class="panel-label">回答语言 / Language</label>
        <select id="langSelect" class="select">
          <option value="中文">中文</option>
          <option value="English">English</option>
        </select>
      </div>

      <div class="panel">
        <label class="panel-label">试试这些问题</label>
        <div class="examples" id="examples"></div>
      </div>

      <div class="sidebar-footer">
        <button class="btn-ghost" id="clearBtn">清空对话</button>
        <p class="tech-note">GLM-4-Flash · bge-base-zh · FAISS</p>
      </div>
    </aside>

    <main class="chat">
      <div class="messages" id="messages">
        <div class="hero" id="hero">
          <div class="hero-glow"></div>
          <div class="hero-logo">🎓</div>
          <h2>你好，我是湘潭大学学业助手</h2>
          <p>基于校园私域知识库的 RAG 问答系统<br>学业规定 · 课程指南 · 办事流程，有问必答</p>
          <div class="hero-tags">
            <span>📋 教务规定</span>
            <span>🎓 学籍管理</span>
            <span>💻 软件教程</span>
            <span>🏫 校园服务</span>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="输入你的学业问题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="btn-send" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13"></path>
              <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
            </svg>
          </button>
        </div>
        <p class="composer-hint">回答由 AI 基于知识库生成，重要信息请以学校官方文件为准</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/app.js"></script>
</body>
</html>
