[project]
name = "xtuagent"
version = "0.1.0"
description = "基于RAG的校园智能学业问答系统设计与实现"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "pypdf2>=3.0.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.24.0",
    "zhipuai>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtuagent"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
