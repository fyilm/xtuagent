[project]
name = "xtuagent"
version = "0.1.0"
description = "基于RAG架构的湘潭大学智能学业问答助手"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf2>=3.0.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.24.0",
    "zhipuai>=2.0.0",
    "qianfan>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "streamlit>=1.38.0",
    "gradio>=5.0.0",
    "openai>=2.45.0",
    "langchain-openai>=1.3.4",
    "faiss-cpu>=1.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtuagent"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
